apiVersion: v1
kind: Namespace
metadata:
  labels:
    app: backsnap
    app.kubernetes.io/name: namespace
    app.kubernetes.io/instance: backsnap
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: backsnap
    app.kubernetes.io/part-of: backsnap
    app.kubernetes.io/managed-by: kustomize
  name: backsnap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backsnap-operator
  namespace: backsnap
  labels:
    app: backsnap
    control-plane: controller-manager
    app.kubernetes.io/name: deployment
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: backsnap
    app.kubernetes.io/part-of: backsnap
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app: backsnap
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app: backsnap
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        args:
        # Start a leader election, ensuring that even with two replicas, only one operator
        # is active at a time.
        - --leader-elect
        # In order to include only particular namespaces (default is all namespaces):
        # - --namespaces
        # - one,two,three

        # Alternatively, in order to exclude namespaces. We'd recommend setting a schedule
        # annotation on the namespace instead of using this option, if possible.
        # - --exclude-namespaces
        # - dev,staging,testing

        # Set a default schedule. The default is @daily. We'd recommend keeping this default
        # and overriding it on a per-namespace basis.
        # - --schedule
        # - @weekly

        # Enable manual mode. This never creates automatic PVCBackups, even if a namespace or
        # PVC sets a particular schedule in its annotations. If this is set, the operator only
        # performs back-ups for PVCBackup objects created externally (e.g., by you).
        # - --manual

        # Backsnap automatically creates volume snapshots while it is preparing
        # for a backup. The volume snapshot class name set here is used for all
        # volume snapshots created by Backsnap. Otherwise, the cluster default
        # volume snapshot class name is used.
        # - --snapshotclass
        # - csi-snapshot

        # The storage class name set here is used for all PVCs created by Backsnap
        # both while creating a back-up and while restoring one. Otherwise, the
        # cluster default storage class is used.
        # - -storageclass
        # - csi-block

        # Optionally, separate storage classes can be set for the temporary PVCs
        # created while making a back-up, and for the PVCs created while restoring
        # one. These take precedence over -storageclass. The storage class for
        # back-ups must support creating volumes from volume snapshots. Individual
        # PVCBackup and PVCRestore objects can override these using
        # spec.storageClassName.
        # - -backup-storageclass=csi-block
        # - -restore-storageclass=csi-block-replicated

        # The image used by backup and restore Jobs. By default, this is the
        # sjorsgielen/backsnap-restic image released with this Backsnap version.
        # - -image=my-registry/backsnap-restic:v0.10.0

        # Extra environment variables for backup and restore containers. Can be
        # repeated. See the README for useful variables.
        # - -restic-env=GOGC=20

        # Resources of backup and restore containers, as JSON. Default is a
        # request of 128Mi memory and 20m CPU, without limits. See the README.
        # - '-restic-resources={"requests":{"memory":"512Mi"},"limits":{"memory":"2Gi"}}'

        # The location and credentials of the S3 bucket where backups will be stored.
        # The S3 hostname can be host, host:port or http://host:port/. Any target supported
        # by Restic is supported, also e.g. RustFS.
        - --s3-host
        - s3.us-west-004.backblazeb2.com
        - --s3-bucket
        - backsnap
        - --s3-access-key-id
        - 004ffef...0003
        - --s3-secret-access-key
        - "K004KC/..."

        # The encryption key by which Restic will client-side encrypt your
        # backup. Do not lose this!
        - --restic-password
        - ChangeMe

        # While rotating the restic password, set the previous password here.
        # Backups move repositories that still use it to the new password. See
        # the README.
        # - --restic-old-password
        # - OldPassword

        # There are other supported flags, too. See the manager --help (or
        # main.go) for more information.

        image: sjorsgielen/backsnap:latest
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
