apiVersion: backsnap.skyb.it/v1alpha1
kind: PVCBackup
metadata:
  name: my-data-backup
  namespace: my-application
spec:
  pvc: my-data
  ttl: 1h

  # If specified, the StorageClass of the temporary PVC created from the
  # VolumeSnapshot. It must support creating volumes from VolumeSnapshots.
  # Otherwise, the operator's configured backup StorageClass is used, or the
  # cluster default.
  #storageClassName: "csi-block"
