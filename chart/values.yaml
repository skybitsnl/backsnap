# Default values for backsnap.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: sjorsgielen/backsnap
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 128Mi
  # requests:
  #   cpu: 10m
  #   memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

app:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - "ALL"
  namespaces:
    allow: []
    exclude: []
  # Default is @daily when schedule is blank. Other options include but are not limited to: @hourly and @weekly
  # See https://crontab.guru/ for examples and explanations.
  schedule: "@daily"
  # Default is nothing to run backsnap in automatic mode
  manual: ""
  snapshotClass: ""
  storageClass: ""
  # Override storageClass for backup or restore PVCs only
  backupStorageClass: ""
  restoreStorageClass: ""
  s3:
    host: ""
    bucket: ""
    accessKey: ""
    secretKey: ""
  restic:
    password: ""
    # While rotating the password, the previous password. See the README.
    oldPassword: ""
    # Default is the restic image released with this Backsnap version
    image: ""
    # Extra environment variables for backup and restore containers, e.g.
    # GOGC: "20". See the README for useful variables.
    env: {}
    # Resources of backup and restore containers. Default is a request of 128Mi
    # memory and 20m CPU, without limits. See the README.
    resources: {}
    #  requests:
    #    memory: 512Mi
    #  limits:
    #    memory: 2Gi
